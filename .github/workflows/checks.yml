name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- just setup
      - run: mise exec -- just verify
      - run: mise exec -- pnpm --dir apps/polymind exec playwright install --with-deps chromium
      - run: mise exec -- just test-browser
