name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- just setup
      - run: mise exec -- just verify
      - run: mise exec -- just build-container
      - run: mise exec -- just test-matching-container
      - run: mise exec -- just build-puck-container
      - run: mise exec -- just test-puck-container
      - run: mise exec -- just build-hub-container
      - run: mise exec -- just test-hub-container
      - run: mise exec -- pnpm --dir apps/polymind exec playwright install --with-deps chromium
      - run: mise exec -- just test-browser
