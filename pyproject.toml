[project]
name = "conference-match"
version = "0.1.0"
description = "Whole-text event matching experiments"
authors = [
    { name = "jobi", email = "git@jobi.is" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
match = "conference_match.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-networkx>=3.6.1.20261108",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
