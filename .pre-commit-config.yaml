repos:
  - repo: local
    hooks:
      - id: match-ruff
        name: match ruff check
        entry: mise exec -- uv run --directory packages/match --frozen ruff check .
        language: system
        files: ^packages/match/(.*\.py$|pyproject\.toml$)
        pass_filenames: false
      - id: match-format
        name: match ruff format check
        entry: mise exec -- uv run --directory packages/match --frozen ruff format --check .
        language: system
        files: ^packages/match/(.*\.py$|pyproject\.toml$)
        pass_filenames: false
      - id: match-pyright
        name: match pyright
        entry: mise exec -- uv run --directory packages/match --frozen pyright
        language: system
        files: ^packages/match/(src/|tests/|experiments/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      - id: match-pytest
        name: match pytest
        entry: mise exec -- uv run --directory packages/match --frozen pytest
        language: system
        files: ^packages/match/(src/|tests/|experiments/|contracts/|examples/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      - id: puck-check
        name: puck lint and format
        entry: mise exec -- pnpm --dir apps/puck check
        language: system
        files: ^apps/puck/
        pass_filenames: false
      - id: puck-typecheck
        name: puck types
        entry: mise exec -- pnpm --dir apps/puck typecheck
        language: system
        files: ^apps/puck/
        pass_filenames: false
      - id: puck-test
        name: puck unit tests
        entry: mise exec -- pnpm --dir apps/puck test
        language: system
        files: ^apps/puck/
        pass_filenames: false
      - id: polymind-check
        name: polymind lint and format
        entry: mise exec -- pnpm --dir apps/polymind check
        language: system
        files: ^apps/polymind/
        pass_filenames: false
